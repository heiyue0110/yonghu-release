name: Update EverFox 2.0 fitting data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: everfox-fitting-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Download latest fitting data and pinned Alpha engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/package .tmp/compat
          npm pack eve-fit-engine@latest --pack-destination .tmp/package
          archive="$(find .tmp/package -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$archive"
          mkdir -p .tmp/unpacked
          tar -xzf "$archive" -C .tmp/unpacked
          npm install --prefix .tmp/compat --no-save --ignore-scripts eve-fit-engine@0.1.19

      - name: Verify Alpha compatibility and prepare immutable feed
        shell: bash
        run: |
          set -euo pipefail
          engine_version="$(node -p "require('./.tmp/unpacked/package/package.json').version")"
          node scripts/verify-fitting-data-compatibility.mjs \
            --data .tmp/unpacked/package/data \
            --engine-package .tmp/compat
          node scripts/update-fitting-data.mjs \
            --source .tmp/unpacked/package/data \
            --output v2-alpha/fitting-data \
            --base-url https://heiyue0110.github.io/yonghu-release/v2-alpha/fitting-data/ \
            --engine-version "$engine_version" \
            --engine-root .tmp/unpacked/package

      - name: Publish only when verified data changed
        shell: bash
        run: |
          set -euo pipefail
          git add v2-alpha/fitting-data
          if git diff --cached --quiet; then
            echo "Fitting data is already current."
            exit 0
          fi
          version="$(node -p "require('./v2-alpha/fitting-data/stable/manifest.json').version")"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "data: update EverFox 2.0 fitting dataset ${version}"
          git push
