    <script>
      (() => {
        const params = new URLSearchParams(location.search);
        if (params.get('intel-overlay') === '1') {
          document.documentElement.dataset.shell = 'overlay';
        } else if (params.get('region-selector') === '1') {
          document.documentElement.dataset.shell = 'region';
        } else {
          document.documentElement.dataset.shell = 'main';
        }

        if (document.documentElement.dataset.shell !== 'main') return;

        try {
          document.documentElement.dataset.bootTheme = 'eve-hud';
          const prefs = JSON.parse(localStorage.getItem('everfox.ui.preferences.v1') || '{}');
          const preset = String(prefs.theme_preset || '').toLowerCase().trim();
          const dark = prefs.dark_theme !== false;
          const knownPresets = new Set([
            'arknights-terminal',
            'arknights-terminal-light',
            'endfield-industries',
            'endfield-industries-light',
            'classic-voice',
            'eve-hud',
            'concord-control',
            'liquid-glass',
            'nailoong-secret',
            'wormhole-scan',
            'nebula',
            'mist-blue',
            'sand-amber',
            'sage-green',
            'ice-cyan',
            'peach-rose',
          ]);
          const darkBootPresets = new Set([
            'arknights-terminal',
            'endfield-industries',
            'eve-hud',
            'wormhole-scan',
            'nebula',
          ]);
          if (knownPresets.has(preset) && darkBootPresets.has(preset)) {
            document.documentElement.dataset.bootTheme = preset;
          } else if (dark) {
            document.documentElement.dataset.bootTheme = 'dark-amber';
          }
          if (prefs.accent_color && /^#[0-9a-f]{6}$/i.test(String(prefs.accent_color))) {
            document.documentElement.style.setProperty('--boot-accent', prefs.accent_color);
          }
        } catch {
          document.documentElement.dataset.bootTheme = 'dark-amber';
        }
      })();
    </script>

        background: var(--boot-bg);

        margin-top: 6px;
        color: var(--boot-muted);
        font-size: 12px;
      }

      .boot-bar {
        width: 100%;
        height: 3px;
        margin-top: 14px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--boot-bar-bg);
      }

      .boot-bar::before {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: var(--boot-bar-fill);
        animation: boot-slide 1.15s ease-in-out infinite;
      }

      @keyframes boot-slide {
        0% { transform: translateX(-110%); }
